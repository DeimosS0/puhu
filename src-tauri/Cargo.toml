[package]
name = "puhu"
description = "Puhu — an owl at the top of your screen"
authors = ["Deimos"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "puhu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The progress log's signature (progress.rs): HMAC-SHA256 and the random key. Already in the
# tree through reqwest's rustls. Apache-2.0 AND ISC.
ring = "0.17"
# Flow dictation and the Notetaker (flow/, notes/, speech/). Speech to text runs
# on this computer: sherpa-onnx (Apache-2.0) with NVIDIA's Parakeet, linked
# statically (onnxruntime included), the models downloaded on the user's click.
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["static"] }
# The microphone, and the computer's own sound for the Notetaker (WASAPI
# loopback on Windows, a PulseAudio/PipeWire monitor on Linux). Apache-2.0.
cpal = "0.18"
# WhatsApp's "Install WhatsApp" takes GOWA's binary out of the zip GOWA publishes (whatsapp/archive.rs):
# the raw DEFLATE decoder only, already in the tree through png (the same 0.8.9), so nothing new is
# downloaded or compiled. MIT/Zlib/Apache-2.0.
miniz_oxide = "0.8"
# The island's screenshot viewer shows and saves the image as a PNG (screenshot.rs): the same 0.18.1
# already in the tree, so nothing new is downloaded or compiled. MIT/Apache-2.0.
png = "0.18"
# The chat's mail merge cuts a PDF into one page per recipient and reads each page's text
# (mail/pdf.rs); Windows has no PDF library of its own. MIT, pure
# Rust, default features (clock, rayon) off.
lopdf = { version = "0.46", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The island's file drop reads paths straight from WebView2 (webview_drop.rs).
# Same versions as wry, so nothing new is compiled.
webview2-com = "0.39"
wv2_core = { package = "windows-core", version = "0.62" }
# #[implement] (system_volume.rs) names the windows crate's own core as `windows_core`.
windows-core = "0.61"
windows = { version = "0.61", features = [
  # The Spotify pill: the system media controls Spotify publishes to.
  "Foundation",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  # The Spotify pill's volume: Spotify's session in the Windows mixer.
  "Win32_Media_Audio",
  # The island's volume indicator: the default output's volume, as it changes.
  "Win32_Media_Audio_Endpoints",
  # Which output is new (headphones or not, and its name): its property store.
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  # The island's screenshot preview: an image landing on the clipboard.
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  # (its message-only window's class)
  "Win32_Graphics_Gdi",
  # The island's battery indicator: the charger plugged in or out, and the battery level.
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  # "Open terminal": the relay's process tree leads to the session's window.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  # The island kept above windows that come to the front later (platform::keep_on_top).
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Flow dictation's keyboard hook.
  "Win32_System_LibraryLoader",
  # The island's internet indicator: the network changing, and whether it still reaches the internet.
  "Networking_Connectivity",
  # The island's download indicator: files arriving in the Downloads folder.
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  # Ask the screen: the monitor under the pointer through Windows Graphics Capture.
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics",
  "Win32_System_WinRT_Graphics_Capture",
] }
# The clipboard for Flow dictation, kept out of the clipboard history. MIT/Apache-2.0.
arboard = { version = "3.6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet) over D-Bus, encrypted in transit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
# libdbus, which keyring's Secret Service already links, so nothing new is
# downloaded: Wayland global shortcuts through the XDG GlobalShortcuts portal
# (portal.rs), the Spotify pill over MPRIS (spotify.rs) and "Open terminal"
# through KWin's scripting (platform/linux_focus.rs).
dbus = "0.9.12"
# EWMH on X11 for "Open terminal", already in the tree (global-hotkey).
x11rb = { version = "0.13", default-features = false, features = ["xinput", "xtest"] }
# PulseAudio (or PipeWire's PulseAudio server) for the microphone list and the
# monitor of the speakers, the Notetaker's "computer sound". Pure Rust client.
cpal = { version = "0.18", features = ["pulseaudio"] }
# The clipboard for Flow dictation (X11, and Wayland's data-control protocol).
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
